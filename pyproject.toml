[project]
name = "aulos"
version = "5.5.0"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.5.0",
    "openai>=1.60.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "tzdata>=2026.4",
    "trafilatura>=2.0",
    "websearch-py>=0.1.0",
    "playwright>=1.49",
    "mcp>=2",
    "pyyaml>=6.0",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
interactive = [
    "prompt-toolkit>=3.0.53",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: 真实子进程/浏览器/shell 集成测试, 开发快循环用 -m \"not slow\" 跳过",
]
timeout = 120
timeout_method = "thread"
