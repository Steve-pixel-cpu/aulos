<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Aulos · 品牌概念预览</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --gold1:#f6c964; --gold2:#d98a2b; --gold3:#8a5416; --ink:#101116; --ink2:#17181f; --paper:#f4efe6; --text:#efe7d7; --text3:#8b8578; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0b0f; font-family:"Segoe UI",system-ui,sans-serif; color:var(--text); }
  section { padding:56px 48px; border-bottom:1px solid #1e1f27; }
  h2 { font-size:13px; letter-spacing:.25em; color:var(--text3); text-transform:uppercase; margin-bottom:28px; font-weight:600; }
  .row { display:flex; gap:40px; align-items:flex-end; flex-wrap:wrap; }

  /* ============ 图标主方案 ============ */
  .tile { display:flex; flex-direction:column; gap:12px; align-items:center; }
  .tile small { color:var(--text3); font-size:12px; letter-spacing:.08em; }

  /* ============ splash ============ */
  .splash {
    width:1280px; height:760px; margin:0 auto; border-radius:18px; overflow:hidden; position:relative;
    background:
      radial-gradient(52% 40% at 50% 30%, rgba(246,201,100,.10), transparent 70%),
      radial-gradient(40% 34% at 78% 88%, rgba(150,110,255,.07), transparent 70%),
      radial-gradient(44% 36% at 18% 92%, rgba(80,180,160,.06), transparent 70%),
      linear-gradient(180deg, #111218, #0c0d12);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0;
    border:1px solid #23242e;
  }
  .splash .mark { filter: drop-shadow(0 14px 60px rgba(246,201,100,.28)); }
  .wordmark { font-family:Cinzel,serif; font-size:64px; font-weight:700; letter-spacing:.38em; text-indent:.38em;
    margin-top:34px; color:var(--text);
    background:linear-gradient(120deg,#f6e7c4 20%, var(--gold1) 55%, #caa04e 90%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .meander { margin-top:26px; opacity:.85; }
  .tagline { margin-top:18px; font-size:15px; letter-spacing:.42em; text-indent:.42em; color:var(--text3); }
  .dots { margin-top:64px; display:flex; gap:10px; }
  .dots i { width:7px; height:7px; border-radius:50%; background:var(--gold1); opacity:.35; animation:dp 1.4s ease-in-out infinite; }
  .dots i:nth-child(2){ animation-delay:.2s } .dots i:nth-child(3){ animation-delay:.4s }
  @keyframes dp { 0%,100%{opacity:.25; transform:translateY(0)} 50%{opacity:.95; transform:translateY(-4px)} }
  .splash .corner { position:absolute; font-family:Cinzel,serif; font-size:12px; letter-spacing:.3em; color:#3c3d49; }

  /* 浅色splash变体 */
  .splash.light {
    background:
      radial-gradient(52% 40% at 50% 30%, rgba(217,138,43,.12), transparent 70%),
      linear-gradient(180deg, var(--paper), #ece5d6);
    border-color:#e0d7c4;
  }
  .splash.light .wordmark { background:linear-gradient(120deg,#8a5416, #b97e2c 60%, #6f4312); -webkit-background-clip:text; background-clip:text; }
  .splash.light .tagline { color:#a09478; }
  .splash.light .dots i { background:var(--gold2); }

  /* 单色 glyph（托盘/关于页） */
  .mono { display:flex; gap:40px; }
</style>
</head>
<body>

<!-- ============ ① 应用图标 ============ -->
<section>
  <h2>① App Icon · 主方案「双管 + 声波」</h2>
  <div class="row">
    <div class="tile">
      <svg width="200" height="200" viewBox="0 0 512 512">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1d1e26"/><stop offset="1" stop-color="#111218"/>
          </linearGradient>
          <radialGradient id="glow" cx=".5" cy=".62" r=".55">
            <stop offset="0" stop-color="#f6c964" stop-opacity=".22"/><stop offset="1" stop-color="#f6c964" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="pipeL" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#f8d98a"/><stop offset=".5" stop-color="#eab54f"/><stop offset="1" stop-color="#c98a2e"/>
          </linearGradient>
          <linearGradient id="pipeR" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#eec065"/><stop offset="1" stop-color="#b5761f"/>
          </linearGradient>
        </defs>
        <rect width="512" height="512" rx="116" fill="url(#bg)"/>
        <rect width="512" height="512" rx="116" fill="url(#glow)"/>
        <!-- 声波(左右各两道) -->
        <g stroke="#f6c964" stroke-width="13" stroke-linecap="round" fill="none" opacity=".55">
          <path d="M118 206 a96 96 0 0 0 0 100"/>
          <path d="M76 178 a150 150 0 0 0 0 156" opacity=".45"/>
          <path d="M394 206 a96 96 0 0 1 0 100"/>
          <path d="M436 178 a150 150 0 0 1 0 156" opacity=".45"/>
        </g>
        <!-- 双管: 左高右低, 顶部哨口, 管身指孔 -->
        <g>
          <rect x="216" y="128" width="60" height="256" rx="26" fill="url(#pipeL)"/>
          <rect x="222" y="112" width="48" height="34" rx="14" fill="#8a5416"/>
          <circle cx="246" cy="216" r="7.5" fill="#7a4a12"/>
          <circle cx="246" cy="266" r="7.5" fill="#7a4a12"/>
          <circle cx="246" cy="316" r="7.5" fill="#7a4a12"/>
        </g>
        <g>
          <rect x="284" y="176" width="60" height="208" rx="26" fill="url(#pipeR)"/>
          <rect x="290" y="160" width="48" height="34" rx="14" fill="#8a5416"/>
          <circle cx="314" cy="258" r="7.5" fill="#6e420f"/>
          <circle cx="314" cy="308" r="7.5" fill="#6e420f"/>
        </g>
        <!-- 底部谱线: 三根短横, 呼应音乐 -->
        <g stroke="#f6c964" stroke-width="10" stroke-linecap="round" opacity=".5">
          <path d="M196 424 H316"/>
        </g>
      </svg>
      <small>主图标 · 深色 512</small>
    </div>

    <div class="tile">
      <svg width="120" height="120" viewBox="0 0 512 512">
        <rect width="512" height="512" rx="116" fill="#f4efe6"/>
        <g stroke="#c98a2e" stroke-width="13" stroke-linecap="round" fill="none" opacity=".6">
          <path d="M118 206 a96 96 0 0 0 0 100"/><path d="M394 206 a96 96 0 0 1 0 100"/>
        </g>
        <rect x="216" y="128" width="60" height="256" rx="26" fill="url(#pipeL)"/>
        <rect x="222" y="112" width="48" height="34" rx="14" fill="#8a5416"/>
        <rect x="284" y="176" width="60" height="208" rx="26" fill="url(#pipeR)"/>
        <rect x="290" y="160" width="48" height="34" rx="14" fill="#8a5416"/>
        <path d="M196 424 H316" stroke="#c98a2e" stroke-width="10" stroke-linecap="round" opacity=".5"/>
      </svg>
      <small>浅色底变体</small>
    </div>

    <div class="tile">
      <svg width="64" height="64" viewBox="0 0 512 512"><rect width="512" height="512" rx="116" fill="url(#bg)"/><rect width="512" height="512" rx="116" fill="url(#glow)"/><rect x="216" y="128" width="60" height="256" rx="26" fill="url(#pipeL)"/><rect x="284" y="176" width="60" height="208" rx="26" fill="url(#pipeR)"/><path d="M196 424 H316" stroke="#f6c964" stroke-width="10" stroke-linecap="round" opacity=".5"/></svg>
      <small>64px</small>
    </div>
    <div class="tile">
      <svg width="32" height="32" viewBox="0 0 512 512"><rect width="512" height="512" rx="116" fill="url(#bg)"/><rect x="216" y="128" width="60" height="256" rx="26" fill="url(#pipeL)"/><rect x="284" y="176" width="60" height="208" rx="26" fill="url(#pipeR)"/></svg>
      <small>32px 托盘</small>
    </div>
    <div class="tile">
      <svg width="128" height="128" viewBox="0 0 512 512">
        <g fill="none" stroke="#e8ddc8" stroke-width="34" stroke-linecap="round">
          <path d="M196 128 V384"/><path d="M300 176 V384"/>
          <path d="M150 420 H346" stroke-width="24" opacity=".55"/>
        </g>
      </svg>
      <small>单色 glyph（关于页/水印）</small>
    </div>
  </div>
</section>

<!-- ============ ② 备选: 单管竖笛简化 ============ -->
<section>
  <h2>② 备选方案「单管 · 极简」／「A 字母 monogram」</h2>
  <div class="row">
    <div class="tile">
      <svg width="140" height="140" viewBox="0 0 512 512">
        <rect width="512" height="512" rx="116" fill="url(#bg)"/><rect width="512" height="512" rx="116" fill="url(#glow)"/>
        <rect x="226" y="96" width="60" height="300" rx="28" fill="url(#pipeL)"/>
        <rect x="232" y="80" width="48" height="32" rx="13" fill="#8a5416"/>
        <g stroke="#f6c964" stroke-width="12" stroke-linecap="round" fill="none" opacity=".6">
          <path d="M160 220 a80 80 0 0 0 0 72"/><path d="M352 220 a80 80 0 0 1 0 72"/>
        </g>
      </svg>
      <small>单管斜置声波</small>
    </div>
    <div class="tile">
      <svg width="140" height="140" viewBox="0 0 512 512">
        <rect width="512" height="512" rx="116" fill="url(#bg)"/><rect width="512" height="512" rx="116" fill="url(#glow)"/>
        <!-- 两管交叉成 A -->
        <g stroke-linecap="round">
          <path d="M170 392 L256 120" stroke="url(#pipeL)" stroke-width="52"/>
          <path d="M342 392 L256 120" stroke="url(#pipeR)" stroke-width="52"/>
          <path d="M205 300 H307" stroke="#8a5416" stroke-width="34"/>
        </g>
      </svg>
      <small>双管交叉 = A monogram</small>
    </div>
  </div>
</section>

<!-- ============ ③ Splash 深色 ============ -->
<section>
  <h2>③ Splash · 深色（主）</h2>
  <div class="splash">
    <span class="corner" style="top:26px;left:32px">ΑΥΛΟΣ</span>
    <span class="corner" style="top:26px;right:32px">EST. 2026</span>
    <svg class="mark" width="168" height="168" viewBox="0 0 512 512">
      <rect width="512" height="512" rx="116" fill="url(#bg)"/>
      <rect width="512" height="512" rx="116" fill="url(#glow)"/>
      <g stroke="#f6c964" stroke-width="13" stroke-linecap="round" fill="none" opacity=".55">
        <path d="M118 206 a96 96 0 0 0 0 100"/><path d="M76 178 a150 150 0 0 0 0 156" opacity=".45"/>
        <path d="M394 206 a96 96 0 0 1 0 100"/><path d="M436 178 a150 150 0 0 1 0 156" opacity=".45"/>
      </g>
      <rect x="216" y="128" width="60" height="256" rx="26" fill="url(#pipeL)"/>
      <rect x="222" y="112" width="48" height="34" rx="14" fill="#8a5416"/>
      <circle cx="246" cy="216" r="7.5" fill="#7a4a12"/><circle cx="246" cy="266" r="7.5" fill="#7a4a12"/><circle cx="246" cy="316" r="7.5" fill="#7a4a12"/>
      <rect x="284" y="176" width="60" height="208" rx="26" fill="url(#pipeR)"/>
      <rect x="290" y="160" width="48" height="34" rx="14" fill="#8a5416"/>
      <circle cx="314" cy="258" r="7.5" fill="#6e420f"/><circle cx="314" cy="308" r="7.5" fill="#6e420f"/>
      <path d="M196 424 H316" stroke="#f6c964" stroke-width="10" stroke-linecap="round" opacity=".5"/>
    </svg>
    <div class="wordmark">AULOS</div>
    <svg class="meander" width="220" height="18" viewBox="0 0 220 18">
      <defs><pattern id="mk" width="22" height="18" patternUnits="userSpaceOnUse">
        <path d="M2 16 V2 H20 V10 H11 V6" fill="none" stroke="#b98f3e" stroke-width="2.4"/>
      </pattern></defs>
      <rect width="220" height="18" fill="url(#mk)"/>
    </svg>
    <div class="tagline">AI 编码智能体 · 会唱歌的那种</div>
    <div class="dots"><i></i><i></i><i></i></div>
  </div>
</section>

<!-- ============ ④ Splash 浅色 ============ -->
<section>
  <h2>④ Splash · 浅色（羊皮纸变体）</h2>
  <div class="splash light">
    <svg class="mark" width="150" height="150" viewBox="0 0 512 512" style="filter:drop-shadow(0 10px 40px rgba(185,126,44,.25))">
      <rect width="512" height="512" rx="116" fill="#fbf7ef"/>
      <rect x="216" y="128" width="60" height="256" rx="26" fill="url(#pipeL)"/>
      <rect x="222" y="112" width="48" height="34" rx="14" fill="#8a5416"/>
      <rect x="284" y="176" width="60" height="208" rx="26" fill="url(#pipeR)"/>
      <rect x="290" y="160" width="48" height="34" rx="14" fill="#8a5416"/>
      <g stroke="#c98a2e" stroke-width="13" stroke-linecap="round" fill="none" opacity=".6">
        <path d="M118 206 a96 96 0 0 0 0 100"/><path d="M394 206 a96 96 0 0 1 0 100"/>
      </g>
      <path d="M196 424 H316" stroke="#c98a2e" stroke-width="10" stroke-linecap="round" opacity=".5"/>
    </svg>
    <div class="wordmark">AULOS</div>
    <div class="tagline">AI 编码智能体 · 会唱歌的那种</div>
    <div class="dots"><i></i><i></i><i></i></div>
  </div>
</section>

</body>
</html>
